<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete your SwipePlay account</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://vwrskuvebjqzljzjtbhp.supabase.co; form-action 'none'; base-uri 'none'">
<style>body{font-family:system-ui,sans-serif;max-width:420px;margin:24px auto;padding:0 16px}input,button{display:block;width:100%;padding:12px;margin:8px 0;font-size:16px;box-sizing:border-box}button{background:#c0392b;color:#fff;border:0;border-radius:6px}#m{margin-top:12px}</style></head><body>
<h1>Delete your SwipePlay account</h1><p>Log in to permanently delete your account, games, likes, reports and blocks. This cannot be undone.</p>
<input id="e" type="email" placeholder="Email" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
<button id="b">Delete my account</button><div id="m"></div>
<script>
const SB='https://vwrskuvebjqzljzjtbhp.supabase.co',KEY='sb_publishable_BZ0Bmo0tAf2RP_sP3Mf00w_bqwjl9sB';
const m=document.getElementById('m');
document.getElementById('b').onclick=async()=>{m.textContent='Working...';
try{const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({email:e.value.trim(),password:p.value})});
const j=await r.json();if(!r.ok){m.textContent='Login failed: '+(j.error_description||j.msg||'check your email and password');return}
if(!confirm('Permanently delete this account?')){m.textContent='Cancelled.';return}
const d=await fetch(SB+'/functions/v1/delete-account',{method:'POST',headers:{apikey:KEY,authorization:'Bearer '+j.access_token}});
m.textContent=d.ok?'Account deleted.':'Could not delete the account. Try again later.'}catch(x){m.textContent='Network error.'}};
</script></body></html>
